[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redveil"
version = "1.7.0"
description = "Production-quality web vulnerability PoC & evidence framework for authorized security testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "FitzyPrjkt", email = "fitzyprjkt@users.noreply.github.com"},
]
maintainers = [
    {name = "FitzyPrjkt", email = "fitzyprjkt@users.noreply.github.com"},
]
keywords = [
    "security", "pentest", "vulnerability", "poc", "evidence",
    "bug-bounty", "vdp", "web", "scanner", "owasp", "redteam", "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/FitzyPrjkt/Redveil"
Documentation = "https://github.com/FitzyPrjkt/Redveil/blob/main/USER_GUIDE.md"
Repository = "https://github.com/FitzyPrjkt/Redveil"
Issues = "https://github.com/FitzyPrjkt/Redveil/issues"
Changelog = "https://github.com/FitzyPrjkt/Redveil/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "respx>=0.21",
]

[project.scripts]
redveil = "redveil.cli:app"

[project.entry-points."redveil.checks"]
security-headers = "redveil.checks.headers_security:SecurityHeadersCheck"
information-disclosure = "redveil.checks.disclosure:InfoDisclosureCheck"
cors-policy = "redveil.checks.cors:CORSCheck"
http-methods = "redveil.checks.http_methods:HTTPMethodsCheck"
open-redirect-indicator = "redveil.checks.redirect:OpenRedirectCheck"
source-map-exposure = "redveil.checks.source_maps:SourceMapCheck"
subdomain-finder = "redveil.plugins.discovery.subdomain:SubdomainFinderCheck"
xss-reflected = "redveil.checks.xss:ReflectedXSSCheck"
sqli-time-based = "redveil.checks.sqli:TimeBasedSQLiCheck"
ssrf = "redveil.checks.ssrf:SSRFCheck"
command-injection = "redveil.checks.command_injection:CommandInjectionCheck"
path-traversal = "redveil.checks.path_traversal:PathTraversalCheck"
session-cookie = "redveil.checks.session_cookie:SessionCookieCheck"
bola-idor = "redveil.checks.bola:BOLACheck"
graphql = "redveil.checks.graphql:GraphQLCheck"
bfla = "redveil.checks.bfla:BFLACheck"
bfla-behavior = "redveil.checks.bfla_behavior:BFLABehaviorCheck"
session-invalidation = "redveil.checks.session_invalidation:SessionInvalidationCheck"
mass-assignment = "redveil.checks.mass_assignment:MassAssignmentCheck"

[tool.hatch.build.targets.wheel]
packages = ["src/redveil"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true